name: Release stack

# Собирает и публикует серверный стек как ПУБЛИЧНЫЕ образы GHCR + GitHub Release
# при каждом коммите в main, затрагивающем backend/admin/docker. Деплой —
# PULL-модель: каждый сервер (включая наш) применяет обновление из админки
# («Обновления сервера»), что запускает sidecar `updater`. CI НИ к одному
# серверу не подключается. См. docs/self-update.md.
#
# Образы должны быть публичными (один раз вручную: Packages → каждый пакет →
# Package settings → Change visibility → Public), иначе клиент не сможет
# выполнить анонимный docker pull.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin/**"
      - "docker/**"
      - ".github/workflows/release-stack.yml"
  workflow_dispatch:

permissions:
  contents: write # создать GitHub Release стека
  packages: write # запушить образы в GHCR

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMG=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            STACK_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMG }}/curier-backend:${{ env.VERSION }}
            ${{ env.IMG }}/curier-backend:latest

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: true
          build-args: |
            BACKEND_API_URL=http://backend:8081
          tags: |
            ${{ env.IMG }}/curier-admin:${{ env.VERSION }}
            ${{ env.IMG }}/curier-admin:latest

      - name: Build & push updater
        uses: docker/build-push-action@v6
        with:
          context: ./docker/updater
          push: true
          tags: |
            ${{ env.IMG }}/curier-updater:${{ env.VERSION }}
            ${{ env.IMG }}/curier-updater:latest

      - name: Publish stack release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stack-v${{ env.VERSION }}
          name: stack-v${{ env.VERSION }}
          # prerelease → не попадает в releases/latest, который приложение
          # использует для APK; backend ищет релизы по префиксу "stack-".
          prerelease: true
          body: |
            Серверный стек (backend + admin) ${{ env.VERSION }}.
            ${{ github.event.head_commit.message }}
