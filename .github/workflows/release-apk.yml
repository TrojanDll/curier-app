name: Release APK

# Собирает подписанный release-APK при коммите в main (или вручную) и публикует
# его как GitHub Release. Приложение само проверяет последний релиз через
# GitHub API (repos/<owner>/<repo>/releases/latest) и предлагает обновиться —
# backend/админка в раздаче APK больше НЕ участвуют.
#
# Требует секретов репозитория (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   — release.keystore в base64 (`base64 -w0 release.keystore`)
#   KEYSTORE_PASSWORD — пароль keystore
#   KEY_ALIAS         — алиас ключа
#   KEY_PASSWORD      — пароль ключа
#
# versionCode = github.run_number (монотонно растёт). Имя ассета
# `curier-<run_number>.apk` — из него приложение читает versionCode.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # нужно для создания Release и заливки ассета

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore + write keystore.properties
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Stage APK asset
        working-directory: android
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "APK not found at $SRC"; exit 1; }
          cp "$SRC" "curier-${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: |
            Автоматическая сборка из main.
            ${{ github.event.head_commit.message }}
          make_latest: true
          files: android/curier-${{ github.run_number }}.apk
