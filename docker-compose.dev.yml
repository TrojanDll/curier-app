# Development Postgres only.
# Production compose lives under /docker (Stage 5).
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
services:
  db:
    image: postgres:16-alpine
    container_name: curier_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curier_dev}
      POSTGRES_DB: ${POSTGRES_DB:-curier}
    ports:
      # 5433 on the host avoids both the native Postgres install (5432)
      # and Hyper-V's dynamic exclusion of 55000-56xxx that bites Windows
      # dev machines on every reboot. Inside the container Postgres still
      # listens on 5432 (production compose maps 5432:5432).
      - "5433:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curier} -d ${POSTGRES_DB:-curier}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data_dev:
