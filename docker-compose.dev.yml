# Development Postgres only.
# Production compose lives under /docker (Stage 5).
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
services:
  db:
    image: postgres:16-alpine
    container_name: curier_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curier_dev}
      POSTGRES_DB: ${POSTGRES_DB:-curier}
    ports:
      # 55432 on the host avoids the native Postgres install that often
      # owns 5432 on Windows dev machines. Inside the container Postgres
      # still listens on 5432 (production compose maps 5432:5432).
      - "55432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curier} -d ${POSTGRES_DB:-curier}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data_dev:
